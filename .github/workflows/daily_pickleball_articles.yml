name: Daily Pickleball Articles Sync

on:
  schedule:
    # Runs daily at 10:00 UTC (6:00 AM EDT / 3:00 AM PDT)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Pickleball Articles
        run: |
          python3 tools/fetch_pickleball_articles.py

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trainer/newsletters.csv trainer/newletters.csv
          if git diff --staged --quiet; then
            echo "No new articles found today. CSV files are up to date."
          else
            git commit -m "Auto-update trainer articles from RSS [skip ci]"
            git push
            echo "Successfully pushed updated pickleball articles!"
          fi
